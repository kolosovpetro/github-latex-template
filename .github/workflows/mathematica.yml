name: 'Mathematica'

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

#  schedule:
#    - cron: '0 0 * * 0'

jobs:
  mathematica:
    uses: kolosovpetro/github-latex-template/.github/workflows/mathematica-template.yml@main
    #secrets: inherit
    with:
      mathematica-directory: ./mathematica
      wolfram-image: wolframresearch/wolframengine:15.0
      wolfram-scripts: |
        Tests/GenerateExamplesInPolynomialForm.txt
        Tests/GenerateExamplesInPolynomialFormR0.txt
        Tests/ValidateDoubleSumsOfPowers.txt
        Tests/ValidateDoubleSumsOfPowersAtZero.txt
        Tests/ValidateMultifoldBinomialSumsOfPowers.txt
        Tests/ValidateMultifoldSumsOfPowers.txt
        Tests/ValidateMultifoldSumsOfPowersAtZero.txt
        Tests/ValidateMultifoldSumsOfPowersAtZeroBinomialForm.txt
        Tests/ValidateOrdinarySumsOfPowers.txt
        Tests/ValidateOrdinarySumsOfPowersAtZero.txt
    secrets:
      WOLFRAM_LICENSE_FILE: ${{ secrets.WOLFRAM_LICENSE_FILE }}
