name: 'Mathematica'

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

#  schedule:
#    - cron: '0 0 * * 0'

jobs:
  mathematica:
    uses: kolosovpetro/github-latex-template/.github/workflows/mathematica-template.yml@main
    #secrets: inherit
    with:
      mathematica-directory: ./mathematica
      wolfram-image: wolframresearch/wolframengine:15.0
    secrets:
      WOLFRAM_LICENSE_FILE: ${{ secrets.WOLFRAM_LICENSE_FILE }}
